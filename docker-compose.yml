services:
  postgres:
    image: postgres:16-alpine
    container_name: easycredit_postgres
    restart: always
    environment:
      POSTGRES_DB: easycredit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./EasyCreditApi/Database/01_postgres_schema.sql:/docker-entrypoint-initdb.d/01_postgres_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easycredit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-free:latest
    container_name: easycredit_oracle
    restart: always
    environment:
      ORACLE_PASSWORD: password123
      APP_USER: TRAINING
      APP_USER_PASSWORD: password123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./EasyCreditApi/Database/02_oracle_schema_and_sp.sql:/container-entrypoint-initdb.d/02_oracle_schema_and_sp.sql:ro

volumes:
  postgres_data:
  oracle_data:
